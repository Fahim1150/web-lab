name: CI/CD Pipeline

on:
  push:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests
        run: |
          newman run test/JSONPlaceholder_API_50_Request_Test_Suite.postman_collection.json
