name: CI/CD Pipeline

on:
  push:
    branches:
      - development
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          script: |
            cd /root/web-lab
            git fetch origin
            git reset --hard origin/development
            docker build -t web-lab .
            docker rm -f web-lab-container || true
            docker run -d \
              --restart unless-stopped \
              --name web-lab-container \
              -p 80:80 \
              web-lab
